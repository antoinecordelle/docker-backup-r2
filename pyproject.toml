[project]
name = "docker-backup-r2"
version = "0.1.0"
description = "Periodically upload Docker container backups to a Cloudflare R2 bucket with GFS retention."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[s3]>=5.0",
]

[project.scripts]
backup-r2 = "backup_r2.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
